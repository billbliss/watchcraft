name: Authoring MLX worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Authoritative Convex job ID
        required: true
        type: string
      spec_sha256:
        description: Approved immutable job specification digest
        required: true
        type: string
      dispatch_generation:
        description: Convex dispatch generation
        required: true
        type: string
      expected_revision:
        description: Revision containing the pending dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authoring-mlx-worker-${{ inputs.job_id }}-${{ inputs.dispatch_generation }}
  cancel-in-progress: false

jobs:
  execute:
    name: Run approved MLX authoring job
    runs-on: macos-15
    timeout-minutes: 30
    environment: authoring-production
    env:
      WATCHCRAFT_JOB_ID: ${{ inputs.job_id }}
      WATCHCRAFT_JOB_SPEC_SHA256: ${{ inputs.spec_sha256 }}
      WATCHCRAFT_DISPATCH_GENERATION: ${{ inputs.dispatch_generation }}
      WATCHCRAFT_EXPECTED_REVISION: ${{ inputs.expected_revision }}
      WATCHCRAFT_EXECUTION_PROFILE_ID: macos-mlx
      WATCHCRAFT_EXECUTION_PROFILE_VERSION: "1"
      WATCHCRAFT_YOUTUBE_POT_PROVIDER_DIR: ${{ github.workspace }}/.watchcraft-runtime/bgutil-ytdlp-pot-provider/server
      WATCHCRAFT_CONVEX_URL: ${{ vars.WATCHCRAFT_CONVEX_URL }}
      WATCHCRAFT_R2_BUCKET: ${{ vars.WATCHCRAFT_R2_BUCKET }}
      WATCHCRAFT_R2_ENDPOINT: ${{ vars.WATCHCRAFT_R2_ENDPOINT }}
      WATCHCRAFT_AUTHORING_WORKER_TOKEN: ${{ secrets.WATCHCRAFT_AUTHORING_WORKER_TOKEN }}
      WATCHCRAFT_R2_ACCESS_KEY_ID: ${{ secrets.WATCHCRAFT_R2_ACCESS_KEY_ID }}
      WATCHCRAFT_R2_SECRET_ACCESS_KEY: ${{ secrets.WATCHCRAFT_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7

      - name: Check out pinned YouTube PO-token provider
        uses: actions/checkout@v7
        with:
          repository: Brainicism/bgutil-ytdlp-pot-provider
          ref: 7511309af023b09788dc8f2efc96cc3671291e6c
          path: .watchcraft-runtime/bgutil-ytdlp-pot-provider
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: authoring/mlx-worker-requirements.txt

      - name: Cache the MLX model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: authoring-mlx-whisper-tiny-v1

      - name: Install worker dependencies
        run: python -m pip install --requirement authoring/mlx-worker-requirements.txt

      - name: Build pinned YouTube PO-token provider
        working-directory: .watchcraft-runtime/bgutil-ytdlp-pot-provider/server
        run: |
          npm ci
          ./node_modules/.bin/tsc
          node build/generate_once.js --version

      - name: Verify media tools
        run: |
          command -v say
          node --version
          python -m yt_dlp --version
          python -m pip show bgutil-ytdlp-pot-provider
          test -f "$WATCHCRAFT_YOUTUBE_POT_PROVIDER_DIR/build/generate_once.js"
          command -v ffmpeg || brew install ffmpeg

      - name: Execute authoring job
        run: python authoring/run_queued_worker.py
