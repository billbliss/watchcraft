name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build identity for an untagged test build
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/release-metadata.mjs"
      - "scripts/release-metadata.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact-suffix: windows-x64
            bundles: nsis,msi
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            artifact-suffix: linux-x64
            bundles: deb,appimage
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS Apple Silicon
            os: macos-14
            artifact-suffix: macos-arm64
            bundles: dmg
            artifact-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare build channel
        id: release
        env:
          WATCHCRAFT_CHANNEL: ${{ inputs.channel || 'beta' }}
        run: node scripts/release-metadata.mjs apps/desktop/src-tauri/tauri.workflow.conf.json

      - name: Run unit tests
        run: npm test

      - name: Build native installer
        run: npm exec --workspace @watchcraft/desktop -- tauri build --config src-tauri/tauri.workflow.conf.json --bundles ${{ matrix.bundles }}

      - name: Remove the extra DMG volume icon
        if: runner.os == 'macOS'
        run: node scripts/remove-dmg-volume-icon.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: watchcraft-${{ steps.release.outputs.channel }}-${{ matrix.artifact-suffix }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          release_args=(--title "Watchcraft ${GITHUB_REF_NAME#v}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}" --repo "$GITHUB_REPOSITORY"
