name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build identity for an untagged test build
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/release-metadata.mjs"
      - "scripts/release-metadata.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      WATCHCRAFT_APPLE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact-suffix: windows-x64
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            artifact-suffix: linux-x64
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS Apple Silicon
            os: macos-14
            artifact-suffix: macos-arm64
            artifact-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare build channel
        id: release
        env:
          WATCHCRAFT_CHANNEL: ${{ inputs.channel || 'beta' }}
          WATCHCRAFT_DEVELOPER_ID_SIGNING: ${{ runner.os == 'macOS' && env.WATCHCRAFT_APPLE_SIGNING == 'true' }}
        run: node scripts/release-metadata.mjs apps/desktop/src-tauri/tauri.workflow.conf.json

      - name: Run unit tests
        run: npm test

      - name: Build native installer
        if: runner.os != 'macOS' || env.WATCHCRAFT_APPLE_SIGNING != 'true'
        run: npm exec --workspace @watchcraft/desktop -- tauri build --config src-tauri/tauri.workflow.conf.json --bundles ${{ steps.release.outputs.bundles }}

      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS' && env.WATCHCRAFT_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm exec --workspace @watchcraft/desktop -- tauri build --config src-tauri/tauri.workflow.conf.json --bundles ${{ steps.release.outputs.bundles }}

      - name: Verify Linux packaging
        if: runner.os == 'Linux'
        env:
          WATCHCRAFT_BINARY_NAME: ${{ steps.release.outputs.binary_name }}
          WATCHCRAFT_CHANNEL: ${{ steps.release.outputs.channel }}
          WATCHCRAFT_DEEP_LINK_SCHEMES: ${{ steps.release.outputs.schemes }}
          WATCHCRAFT_DESKTOP_NAME: ${{ steps.release.outputs.desktop_name }}
          WATCHCRAFT_METAINFO_NAME: ${{ steps.release.outputs.metainfo_name }}
          WATCHCRAFT_PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail

          appimage_path="$(find apps/desktop/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          deb_path="$(find apps/desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$appimage_path" || -z "$deb_path" ]]; then
            echo "The Linux build did not produce both an AppImage and a Debian package." >&2
            exit 1
          fi

          deb_package_name="$(dpkg-deb -f "$deb_path" Package)"
          if [[ "$deb_package_name" != "$WATCHCRAFT_PACKAGE_NAME" ]]; then
            echo "Expected Debian package $WATCHCRAFT_PACKAGE_NAME, found $deb_package_name." >&2
            exit 1
          fi

          if [[ "$WATCHCRAFT_CHANNEL" == "release" ]]; then
            legacy_beta="watchcraft-beta (<= 0.2.0-beta.2)"
            deb_conflicts="$(dpkg-deb -f "$deb_path" Conflicts)"
            deb_replaces="$(dpkg-deb -f "$deb_path" Replaces)"
            if [[ "$deb_conflicts" != *"$legacy_beta"* || "$deb_replaces" != *"$legacy_beta"* ]]; then
              echo "The stable Debian package does not replace legacy beta packages." >&2
              exit 1
            fi
          fi

          extract_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$extract_dir"
          }
          trap cleanup EXIT

          chmod +x "$appimage_path"
          appimage_path="$(realpath "$appimage_path")"
          (
            cd "$extract_dir"
            "$appimage_path" --appimage-extract >/dev/null
          )

          appimage_binary="$(find "$extract_dir/squashfs-root" -type f -path "*/bin/$WATCHCRAFT_BINARY_NAME" -print -quit)"
          if [[ -z "$appimage_binary" ]]; then
            echo "The AppImage does not contain $WATCHCRAFT_BINARY_NAME." >&2
            exit 1
          fi

          plugin_dir="$(find "$extract_dir/squashfs-root/usr/lib" -type d -name 'gstreamer-1.0' -print -quit)"
          if [[ -z "$plugin_dir" ]] || ! find "$plugin_dir" -type f -print -quit | grep -q .; then
            echo "The AppImage does not contain the GStreamer media plugins required by WebKitGTK." >&2
            exit 1
          fi

          deb_dependencies="$(dpkg-deb -f "$deb_path" Depends)"
          for dependency in gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav; do
            if [[ "$deb_dependencies" != *"$dependency"* ]]; then
              echo "The Debian package is missing its $dependency dependency." >&2
              exit 1
            fi
          done

          deb_extract_dir="$extract_dir/deb"
          dpkg-deb --extract "$deb_path" "$deb_extract_dir"
          if [[ ! -x "$deb_extract_dir/usr/bin/$WATCHCRAFT_BINARY_NAME" ]]; then
            echo "The Debian package does not contain /usr/bin/$WATCHCRAFT_BINARY_NAME." >&2
            exit 1
          fi
          other_binary="watchcraft"
          if [[ "$WATCHCRAFT_BINARY_NAME" == "watchcraft" ]]; then
            other_binary="watchcraft-beta"
          fi
          if [[ -e "$deb_extract_dir/usr/bin/$other_binary" ]]; then
            echo "The Debian package unexpectedly contains /usr/bin/$other_binary." >&2
            exit 1
          fi
          metainfo_path="$deb_extract_dir/usr/share/metainfo/$WATCHCRAFT_METAINFO_NAME"
          if [[ ! -f "$metainfo_path" ]]; then
            echo "The Debian package is missing $WATCHCRAFT_METAINFO_NAME for Ubuntu App Center." >&2
            exit 1
          fi
          metainfo_count="$(find "$deb_extract_dir/usr/share/metainfo" -type f -name 'app.watchcraft.reader*.metainfo.xml' | wc -l)"
          if [[ "$metainfo_count" -ne 1 ]]; then
            echo "The Debian package contains metadata belonging to another Watchcraft channel." >&2
            exit 1
          fi
          appstreamcli validate "$metainfo_path"

          appimage_desktop="$extract_dir/squashfs-root/usr/share/applications/$WATCHCRAFT_DESKTOP_NAME"
          deb_desktop="$deb_extract_dir/usr/share/applications/$WATCHCRAFT_DESKTOP_NAME"
          if [[ ! -f "$appimage_desktop" || ! -f "$deb_desktop" ]]; then
            echo "The Linux package is missing $WATCHCRAFT_DESKTOP_NAME." >&2
            exit 1
          fi
          IFS=',' read -ra deep_link_schemes <<< "$WATCHCRAFT_DEEP_LINK_SCHEMES"
          for deep_link_scheme in "${deep_link_schemes[@]}"; do
            for desktop_file in "$appimage_desktop" "$deb_desktop"; do
              if [[ -z "$desktop_file" ]] || ! grep -Fq "x-scheme-handler/$deep_link_scheme" "$desktop_file"; then
                echo "The Linux package does not register $deep_link_scheme links." >&2
                exit 1
              fi
            done
          done
          for desktop_file in "$appimage_desktop" "$deb_desktop"; do
            if ! grep -Eq "^Exec=.*${WATCHCRAFT_BINARY_NAME}([[:space:]\"%]|$)" "$desktop_file"; then
              echo "The Linux desktop launcher does not invoke $WATCHCRAFT_BINARY_NAME." >&2
              exit 1
            fi
            if ! grep -Fxq "Icon=$WATCHCRAFT_BINARY_NAME" "$desktop_file"; then
              echo "The Linux desktop launcher does not use the channel-specific icon." >&2
              exit 1
            fi
            if ! grep -Fxq "StartupWMClass=$WATCHCRAFT_BINARY_NAME" "$desktop_file"; then
              echo "The Linux desktop launcher does not use the channel-specific window class." >&2
              exit 1
            fi
          done

          icon_path="$(find "$deb_extract_dir/usr/share/icons" -type f -path "*/apps/$WATCHCRAFT_BINARY_NAME.png" -print -quit)"
          if [[ -z "$icon_path" ]]; then
            echo "The Debian package does not contain its channel-specific icon." >&2
            exit 1
          fi
          other_icon="$(find "$deb_extract_dir/usr/share/icons" -type f -path "*/apps/$other_binary.png" -print -quit)"
          if [[ -n "$other_icon" ]]; then
            echo "The Debian package unexpectedly contains the other channel's icon." >&2
            exit 1
          fi

      - name: Verify the packaged macOS app signature and notarization
        if: runner.os == 'macOS'
        env:
          WATCHCRAFT_EXPECT_NOTARIZATION: ${{ env.WATCHCRAFT_APPLE_SIGNING }}
          WATCHCRAFT_DEEP_LINK_SCHEMES: ${{ steps.release.outputs.schemes }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No macOS disk image was produced." >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No application bundle was found in $dmg_path." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [[ "$WATCHCRAFT_EXPECT_NOTARIZATION" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            codesign --verify --strict --verbose=2 "$dmg_path"
          fi
          url_types="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app_path/Contents/Info.plist")"
          IFS=',' read -ra deep_link_schemes <<< "$WATCHCRAFT_DEEP_LINK_SCHEMES"
          for deep_link_scheme in "${deep_link_schemes[@]}"; do
            if ! grep -Fq "$deep_link_scheme" <<< "$url_types"; then
              echo "The macOS app does not register $deep_link_scheme links." >&2
              exit 1
            fi
          done

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: watchcraft-${{ steps.release.outputs.channel }}-${{ matrix.artifact-suffix }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          release_args=(--title "Watchcraft ${GITHUB_REF_NAME#v}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}" --repo "$GITHUB_REPOSITORY"
