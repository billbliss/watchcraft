name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build identity for an untagged test build
        required: true
        default: beta
        type: choice
        options:
          - beta
          - release
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/release-metadata.mjs"
      - "scripts/release-metadata.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact-suffix: windows-x64
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-22.04
            artifact-suffix: linux-x64
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS Apple Silicon
            os: macos-14
            artifact-suffix: macos-arm64
            artifact-path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare build channel
        id: release
        env:
          WATCHCRAFT_CHANNEL: ${{ inputs.channel || 'beta' }}
        run: node scripts/release-metadata.mjs apps/desktop/src-tauri/tauri.workflow.conf.json

      - name: Run unit tests
        run: npm test

      - name: Build native installer
        run: npm exec --workspace @watchcraft/desktop -- tauri build --config src-tauri/tauri.workflow.conf.json --bundles ${{ steps.release.outputs.bundles }}

      - name: Verify Linux media packaging
        if: runner.os == 'Linux'
        env:
          WATCHCRAFT_DEEP_LINK_SCHEME: ${{ steps.release.outputs.scheme }}
        shell: bash
        run: |
          set -euo pipefail

          appimage_path="$(find apps/desktop/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          deb_path="$(find apps/desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [[ -z "$appimage_path" || -z "$deb_path" ]]; then
            echo "The Linux build did not produce both an AppImage and a Debian package." >&2
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$extract_dir"
          }
          trap cleanup EXIT

          chmod +x "$appimage_path"
          appimage_path="$(realpath "$appimage_path")"
          (
            cd "$extract_dir"
            "$appimage_path" --appimage-extract >/dev/null
          )

          plugin_dir="$(find "$extract_dir/squashfs-root/usr/lib" -type d -name 'gstreamer-1.0' -print -quit)"
          if [[ -z "$plugin_dir" ]] || ! find "$plugin_dir" -type f -print -quit | grep -q .; then
            echo "The AppImage does not contain the GStreamer media plugins required by WebKitGTK." >&2
            exit 1
          fi

          deb_dependencies="$(dpkg-deb -f "$deb_path" Depends)"
          for dependency in gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav; do
            if [[ "$deb_dependencies" != *"$dependency"* ]]; then
              echo "The Debian package is missing its $dependency dependency." >&2
              exit 1
            fi
          done

          deb_extract_dir="$extract_dir/deb"
          dpkg-deb --extract "$deb_path" "$deb_extract_dir"
          metainfo_path="$(find "$deb_extract_dir/usr/share/metainfo" -type f -name '*.metainfo.xml' -print -quit)"
          if [[ -z "$metainfo_path" ]]; then
            echo "The Debian package is missing AppStream metadata for Ubuntu App Center." >&2
            exit 1
          fi

          appimage_desktop="$(find "$extract_dir/squashfs-root" -type f -name '*.desktop' -print -quit)"
          deb_desktop="$(find "$deb_extract_dir/usr/share/applications" -type f -name '*.desktop' -print -quit)"
          for desktop_file in "$appimage_desktop" "$deb_desktop"; do
            if [[ -z "$desktop_file" ]] || ! grep -Fq "x-scheme-handler/$WATCHCRAFT_DEEP_LINK_SCHEME" "$desktop_file"; then
              echo "The Linux package does not register $WATCHCRAFT_DEEP_LINK_SCHEME links." >&2
              exit 1
            fi
          done

      - name: Remove the extra DMG volume icon
        if: runner.os == 'macOS'
        run: node scripts/remove-dmg-volume-icon.mjs

      - name: Verify the packaged macOS app signature
        if: runner.os == 'macOS'
        env:
          WATCHCRAFT_DEEP_LINK_SCHEME: ${{ steps.release.outputs.scheme }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No macOS disk image was produced." >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No application bundle was found in $dmg_path." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app_path/Contents/Info.plist" \
            | grep -Fq "$WATCHCRAFT_DEEP_LINK_SCHEME"; then
            echo "The macOS app does not register $WATCHCRAFT_DEEP_LINK_SCHEME links." >&2
            exit 1
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: watchcraft-${{ steps.release.outputs.channel }}-${{ matrix.artifact-suffix }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          release_args=(--title "Watchcraft ${GITHUB_REF_NAME#v}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}" --repo "$GITHUB_REPOSITORY"
