name: Publish Watchcraft site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "apps/web/**"
      - "apps/portal/**"
      - "scripts/assemble-site.mjs"
      - "packages/catalog-core/**"
      - "package.json"
      - "package-lock.json"
      - "site/**"
      - "apps/desktop/src-tauri/icons/128x128.png"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Watchcraft website and portal
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ "$VITE_CLERK_PUBLISHABLE_KEY" != pk_live_* || -z "$VITE_CONVEX_URL" ]]; then
            echo "Configure the production Clerk publishable key and Convex URL in repository variables."
            exit 1
          fi
          npm run site:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
