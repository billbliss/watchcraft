name: Publish Watchcraft site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "apps/desktop/src-tauri/icons/128x128.png"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Watchcraft
        uses: actions/checkout@v7
      - name: Assemble the public site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/app.js _site/
          cp apps/desktop/src-tauri/icons/128x128.png _site/assets/watchcraft.png
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
